[project]
name = "declaude"
version = "0.1.0"
description = "Claude-English to plain English translation service (gateway API + MCP)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "google-cloud-firestore>=2.34.1",
    "httpx>=0.27",
    "pydantic>=2.14.3",
    "pyjwt[crypto]>=2.13.0",
    "python-multipart>=0.0.33",
    "stripe>=15.5.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/declaude"]
