name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"   # daily, so a new CVE surfaces without waiting for a commit
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - name: Audit gateway dependencies
        working-directory: gateway
        run: |
          uv export --no-hashes --format requirements-txt > /tmp/reqs.txt
          uvx pip-audit -r /tmp/reqs.txt --strict

  code:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - name: Bandit-equivalent lint (ruff S rules)
        working-directory: gateway
        # Production code is scanned strictly. Tests are scanned with the fixture-noise rules
        # off: S101 is how a test asserts, and S105/S106 fire on obviously fake tokens.
        run: |
          uvx ruff check --select S --output-format github src/
          uvx ruff check --select S --ignore S101,S105,S106 --output-format github tests/

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # gitleaks needs history to catch a secret added and later removed
      # gitleaks-action requires a paid licence for organisations; the CLI does not.
      - name: Scan full history for secrets
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --verbose --exit-code 1

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@v4

  terraform:
    name: Terraform security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infra
          soft_fail: true   # advisory: spot instances and public Cloud Run are deliberate
