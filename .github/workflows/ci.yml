name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Sync deps
        run: uv sync --dev
      - name: Lint
        run: uv run ruff check .
      - name: Test with coverage
        run: uv run pytest -q --cov=src/declaude --cov-report=xml --cov-report=term
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: gateway/coverage.xml
          flags: gateway
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  hook:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hook
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Lint
        # --isolated: the hook ships no project config, so pin the rules to ruff's own.
        # known-first-party: without it, ruff guesses where declaude_hook belongs, and the
        # guess differs between machines. Naming it keeps the import order stable.
        run: >
          uv run --no-project --with ruff ruff check --isolated
          --config "lint.isort.known-first-party=['declaude_hook']" .
      - name: Test hook client
        run: uv run --no-project --with pytest pytest -q .

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - name: fmt
        working-directory: infra
        run: terraform fmt -check -diff
      - name: validate (no backend)
        working-directory: infra
        run: terraform init -backend=false -input=false && terraform validate
